name: Build NexSideloader

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# The last step commits the built binary and pushes it back; the default
# GITHUB_TOKEN permissions are read-only, so write access must be granted.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: aarch64-unknown-linux-musl
        # The action defaults rustflags to "-D warnings", which fails the
        # build on warnings inside the vendored path dependencies
        # (idevice, isideload, apple-codesign-quick). Empty string leaves
        # RUSTFLAGS alone; minis/.cargo/config.toml carries the real flags.
        rustflags: ""

    - name: Cache aarch64-linux-musl cross-compilation tools
      uses: actions/cache@v4
      with:
        path: /opt/cross
        key: ${{ runner.os }}-musl-cross-aarch64

    - name: Install aarch64-linux-musl cross-compilation tools
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            ca-certificates \
            xz-utils \
            bison \
            flex \
            texinfo \
            gawk

          if [ ! -d "/opt/cross/bin" ]; then
            git clone --depth 1 https://github.com/richfelker/musl-cross-make.git
            cd musl-cross-make

            cat > config.mak <<'EOF'
          TARGET = aarch64-linux-musl
          OUTPUT = /opt/cross
          EOF

            make -j"$(nproc)"
            sudo make install
          fi

          echo "/opt/cross/bin" >> "$GITHUB_PATH"

          rustup target add aarch64-unknown-linux-musl

    - name: Build NexSideloader
      env:
        # setup-rust-toolchain v2 defaults this to "deny", which fails on
        # warnings in the vendored path dependencies. Keep it a warning.
        CARGO_BUILD_WARNINGS: warn
      run: |
        cd minis
        RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static" \
          cargo build --release --target aarch64-unknown-linux-musl
    
    - name: Build siboot-pair.wasm
      env:
        # setup-rust-toolchain injects "-D warnings" via RUSTFLAGS (v1) or
        # CARGO_BUILD_WARNINGS=deny (v2); the vendored idevice warns about an
        # unused import when built without the `rsd` feature. Allow warnings.
        RUSTFLAGS: ""
        CARGO_BUILD_WARNINGS: warn
      run: |
        cd rootshell
        rustup target add wasm32-wasip1
        cargo build --release --target wasm32-wasip1
        mkdir -p bin
        cp target/wasm32-wasip1/release/siboot-pair.wasm bin/
    
    - name: Calculate SHA256 and size for NexSideloader
      id: hash
      run: |
        cd minis
        BINARY="target/aarch64-unknown-linux-musl/release/nexsideloader"
        SHA256=$(sha256sum "$BINARY" | awk '{print $1}')
        SIZE=$(stat -c%s "$BINARY")
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "size=$SIZE" >> $GITHUB_OUTPUT
        echo "Binary SHA256: $SHA256"
        echo "Binary size: $SIZE bytes"
    
    - name: Calculate SHA256 for siboot-pair.wasm
      id: wasm_hash
      run: |
        cd rootshell
        WASM="bin/siboot-pair.wasm"
        SHA256=$(sha256sum "$WASM" | awk '{print $1}')
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "WASM SHA256: $SHA256"
    
    - name: Copy binary to bin directory
      run: |
        cd minis
        mkdir -p bin
        cp target/aarch64-unknown-linux-musl/release/nexsideloader bin/NexSideloader-aarch64
        chmod +x bin/NexSideloader-aarch64
    
    - name: Update install.sh with new SHA256 and SIZE
      run: |
        cd minis
        SHA256="${{ steps.hash.outputs.sha256 }}"
        SIZE="${{ steps.hash.outputs.size }}"

        # Update SHA256 in install.sh
        sed -i "s/^SHA256=.*/SHA256=$SHA256/" install.sh

        # Update SIZE in install.sh
        sed -i "s/^SIZE=.*/SIZE=$SIZE/" install.sh

        echo "Updated install.sh:"
        grep -E "^SHA256=|^SIZE=" install.sh
    
    - name: Commit changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add minis/bin/NexSideloader-aarch64 minis/install.sh rootshell/bin/siboot-pair.wasm
        git diff --staged --quiet || git commit -m "Build: Update binaries"
    
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
